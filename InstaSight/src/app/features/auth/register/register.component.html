<div class="register-container">
  <div class="register-card">
    <h2>Register</h2>
    <form (ngSubmit)="createAccount()" #registerForm="ngForm">
      <input 
        type="text" 
        [(ngModel)]="fullName" 
        name="fullName" 
        placeholder="Full Name" 
        required
      />
      <input 
        type="email" 
        [(ngModel)]="email" 
        name="email" 
        placeholder="Email" 
        required
      />
      <input 
        type="text" 
        [(ngModel)]="username" 
        name="username" 
        placeholder="Username" 
        required
      />
      <input 
        type="password" 
        [(ngModel)]="password" 
        name="password" 
        placeholder="Password" 
        required
        minlength="6"
      />
      <input 
        type="password" 
        [(ngModel)]="confirmPassword" 
        name="confirmPassword" 
        placeholder="Confirm Password" 
        required
      />
      <button class="register-btn" type="submit" [disabled]="!registerForm.valid">
        Create Account
      </button>
    </form>

    <p class="login-text">
      Already have an account?
      <a (click)="goToLogin()">Log in</a>
    </p>
  </div>
</div>
