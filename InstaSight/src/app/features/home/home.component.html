<div class="container">
    <h1>👋 Hey there!</h1>
    <p class="subtitle">Ready to begin your traveling adventure?</p>
  
    <form (ngSubmit)="onStart()">
      <label for="location">Please type your location to start:</label>
      <input
        type="text"
        id="location"
        [(ngModel)]="location"
        name="location"
        required
        aria-label="Enter your location"
      />
  
      <button type="submit">Start Journey</button>
    </form>
  </div>
  <app-vertical-footer [email]="email" [username]="username"></app-vertical-footer>
