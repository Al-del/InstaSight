<div class="video-container">
  <video #localVideo autoplay playsinline muted class="fullscreen-video"></video>

  <div *ngIf="!cameraAccessGranted" class="permission-prompt">
    <p>We need your permission to access your camera for video streaming.</p>
    <button
      #permissionButton
      (click)="requestCameraPermission()"
      [disabled]="isLoading"
      class="permission-button"
    >
      <span *ngIf="!isLoading">Allow Camera Access</span>
      <span *ngIf="isLoading">Checking permissions...</span>
    </button>

    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
  </div>

  <div class="control-bar">
    <button (click)="playOnlineSound()" class="control-button">
      <span class="button-icon">🔇</span>
      <span class="button-text">Mute Alerts</span>
    </button>
    <button (click)="switchCamera()" class="control-button">
      <span class="button-text">Switch Camera</span>
    </button>
  </div>
</div>
